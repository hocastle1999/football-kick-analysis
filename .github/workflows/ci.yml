# main에 올라가는 코드와 PR마다 린트와 테스트를 자동으로 돌린다.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# 같은 브랜치에 새 커밋이 올라오면 앞서 돌던 검사는 취소한다
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 린트는 ruff만 있으면 되므로 따로 돌려 몇 초 안에 결과를 본다
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: ruff 설치 (requirements-dev.txt에 고정한 버전)
        run: python -m pip install "$(grep '^ruff==' requirements-dev.txt)"
      - name: 린트
        run: ruff check .
      - name: 포맷 검사
        run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          # 내려받은 패키지를 저장해 두고 다음 실행에서 다시 쓴다(torch 등이 커서 효과가 크다)
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: OpenCV가 쓰는 시스템 라이브러리 설치
        run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0
      - name: 의존성 설치
        run: python -m pip install -r requirements-dev.txt
      - name: 테스트
        run: python -m pytest -q
      # 저장소에 든 키포인트만으로 분류기가 학습되는지 확인한다.
      # 새로 내려받은 사람이 README대로 실행할 수 있다는 것을 보장하기 위한 단계다
      - name: 저장소의 데이터로 학습
        run: |
          python -m scripts.train --task weight
          python -m scripts.train --task foot
